
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your TaskFlow account.">
    <title>Login | TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>
<body class="auth-page">

    <main class="auth-container">
        <section class="auth-card">

            <a href="index.html" class="auth-logo">
                <span class="logo-icon">✓</span>
                <span>TaskFlow</span>
            </a>

            <div class="auth-heading">
                <h1 id="auth-title">Welcome back!</h1>
                <p id="auth-description">
                    Log in to continue managing your tasks.
                </p>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>

                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <small class="error-message" id="login-email-error"></small>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <small class="error-message" id="login-password-error"></small>
                </div>

                <div class="auth-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>

                    <a href="#" id="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="auth-button">
                    Log In
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <button type="button" id="show-register">
                        Create account
                    </button>
                </p>

            </form>

            <!-- Registration Form -->
            <form id="register-form" novalidate hidden>

                <div class="form-group">
                    <label for="register-name">Full name</label>
                    <input
                        type="text"
                        id="register-name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                    <small class="error-message" id="register-name-error"></small>
                </div>

                <div class="form-group">
                    <label for="register-email">Email address</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <small class="error-message" id="register-email-error"></small>
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small class="error-message" id="register-password-error"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                    <small class="error-message" id="confirm-password-error"></small>
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <button type="button" id="show-login">
                        Log in
                    </button>
                </p>

            </form>

            <p id="auth-message" class="auth-message" role="status"
               aria-live="polite"></p>

        </section>

        <footer class="auth-footer">
            &copy; 2026 TaskFlow. Stay organized and get things done.
        </footer>
    </main>

</body>
</html>
